# The GitHub Pages site (https://otzaria.github.io/OtzariaLinker/): the built single file as the home page.
# Pages used to serve the repository's root, where index.html was v3 itself; since 4.0 the root index.html
# is Vite's entry (it loads /src/app/main.tsx) and shows nothing unbuilt. v3 stays at /v3.html.
name: Pages

# The site is deployed only for a commit of main whose CI run succeeded (typecheck, tests, E2E, reproducible build):
# the push no longer deploys by itself, the finished CI run does. workflow_dispatch stays for a manual deploy of the
# branch's head (the owner decides then; nothing checks it).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # for a workflow_run, github.sha is the default branch's head, not the commit CI tested
  SITE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    # `branches: [main]` of the trigger filters by the head branch NAME, which a fork's PR branch can also be called:
    # so a workflow_run counts only when it is a push (not a pull_request) and its head repository is this one.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SITE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: The site
        run: |
          mkdir -p _site
          cp dist/OtzariaLinker.html _site/index.html
          cp dist/OtzariaLinker.html _site/OtzariaLinker.html
          # the hash of the file the page offers for download (the user can compare it with the one in the Release)
          cp dist/SHA256SUMS _site/SHA256SUMS
          cp legacy/OtzariaLinker-v3.html _site/v3.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # the write permissions are only here: the job that checks out and runs npm (build) has none
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # While the repository's Pages source is still "Deploy from a branch", every push to main also starts
      # GitHub's own build of the branch root (pages-build-deployment), whose index.html is Vite's entry. The
      # two race and the last one wins: wait for that build of this commit to finish, so this one is last.
      # (Settings → Pages → Source: "GitHub Actions" removes the branch build; then this step finds none.)
      - name: Wait for the branch build of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            states=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ env.SITE_SHA }}" \
              --jq '[.workflow_runs[] | select(.path == "dynamic/pages/pages-build-deployment") | .status] | join(" ")')
            if [ -n "$states" ] && ! echo "$states" | tr ' ' '\n' | grep -qvx completed; then echo "branch build done: $states"; break; fi
            # none at all after two minutes: there is no branch build (Source is GitHub Actions, or a manual run)
            if [ -z "$states" ] && [ "$i" -ge 12 ]; then echo "no branch build"; break; fi
            sleep 10
          done
      - id: deployment
        uses: actions/deploy-pages@v4
